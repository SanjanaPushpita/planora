name: Supabase Automatic Keep-Alive

on:
  schedule:
    # Runs daily at 04:00 UTC (10:00 AM BD / off-peak)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allows manual heartbeat trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Heartbeat Database Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Endpoint
        env:
          PLANORA_URL: ${{ secrets.PLANORA_PRODUCTION_URL }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_SECRET }}
        run: |
          if [ -z "$PLANORA_URL" ] || [ -z "$KEEPALIVE_TOKEN" ]; then
            echo "::error::Required secrets (PLANORA_PRODUCTION_URL or KEEPALIVE_SECRET) are missing."
            exit 1
          fi

          # Clean URL formatting
          CLEAN_URL=$(echo "$PLANORA_URL" | sed -e 's|^https://||' -e 's|/$||')
          TARGET_ENDPOINT="https://${CLEAN_URL}/api/maintenance/supabase-keepalive"

          echo "Pinging Planora Supabase keep-alive endpoint..."

          # Build curl command with Vercel protection bypass if configured
          if [ -n "$VERCEL_BYPASS" ]; then
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
              -H "Authorization: Bearer ${KEEPALIVE_TOKEN}" \
              -H "Content-Type: application/json" \
              "$TARGET_ENDPOINT")
          else
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${KEEPALIVE_TOKEN}" \
              -H "Content-Type: application/json" \
              "$TARGET_ENDPOINT")
          fi

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Supabase heartbeat recorded successfully."
          else
            echo "::error::Heartbeat failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
